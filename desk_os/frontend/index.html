<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Serif+SC:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=49">
  <link rel="stylesheet" href="/css/flow.css?v=16">
</head>
<body data-mode="windowed" data-layer="status">
  <div id="view-dashboard" class="view active">
    <div id="crt-monitor" class="crt is-on is-booting">
      <div class="crt__bezel">
        <div id="crt-screen" class="crt__screen">
          <div id="layer-status" class="layer is-on">
            <div class="crt-content">
              <main class="terminal">
                <header class="terminal__head">
                  <div id="date" class="terminal__date">--- / --- --</div>
                  <div id="time-text" class="terminal__time">--:--</div>
                  <div id="weather" class="terminal__weather"></div>
                </header>

                <div class="terminal__status-line">
                  <span id="system-status">SYSTEM ONLINE</span>
                </div>

                <div class="terminal__dock">
                <section class="terminal__metrics">
                  <div class="term-row">
                    <span class="term-row__label">CPU</span>
                    <span id="cpu-bar" class="term-row__bar">----------</span>
                    <span id="cpu-val" class="term-row__val">--%</span>
                  </div>
                  <div class="term-row">
                    <span class="term-row__label">GPU</span>
                    <span id="gpu-bar" class="term-row__bar">----------</span>
                    <span id="gpu-val" class="term-row__val">--</span>
                  </div>
                  <div class="term-row">
                    <span class="term-row__label">MEM</span>
                    <span id="ram-bar" class="term-row__bar">----------</span>
                    <span id="ram-val" class="term-row__val">--</span>
                  </div>
                  <div class="term-row" id="vram-row">
                    <span class="term-row__label">VRAM</span>
                    <span id="vram-bar" class="term-row__bar">----------</span>
                    <span id="vram-val" class="term-row__val">--</span>
                  </div>
                  <div class="term-row" id="cur-row">
                    <span class="term-row__label">CUR</span>
                    <span id="cur-bar" class="term-row__bar">----------</span>
                    <span id="cur-val" class="term-row__val">--%</span>
                  </div>
                  <div class="term-row" id="oth-row">
                    <span class="term-row__label">OTH</span>
                    <span id="oth-bar" class="term-row__bar">----------</span>
                    <span id="oth-val" class="term-row__val">--%</span>
                  </div>
                </section>

                <div class="terminal__rule" aria-hidden="true"></div>

                <section class="terminal__info">
                  <div class="info-row">
                    <span class="info-row__label">NET</span>
                    <span class="info-row__val">↓ <span id="net-down">--</span>  ↑ <span id="net-up">--</span></span>
                  </div>
                  <div class="info-row">
                    <span class="info-row__label">DSK</span>
                    <span id="disk-summary" class="info-row__val">--</span>
                  </div>
                  <div class="info-row">
                    <span class="info-row__label">PING</span>
                    <span class="info-row__val"><span id="ping-host">--</span>  <span id="ping">--</span></span>
                  </div>
                  <div class="info-row" id="tmp-row">
                    <span class="info-row__label">TMP</span>
                    <span id="tmp-summary" class="info-row__val">--</span>
                  </div>
                  <div class="info-row">
                    <span class="info-row__label">KEY</span>
                    <span id="key-summary" class="info-row__val">--</span>
                  </div>
                  <div class="info-row">
                    <span class="info-row__label">UP</span>
                    <span id="uptime" class="info-row__val">--</span>
                  </div>
                  <div class="info-row is-hidden" id="rst-row">
                    <span class="info-row__label">RST</span>
                    <span id="rst-val" class="info-row__val">--</span>
                  </div>
                </section>
                </div>
              </main>
            </div>
          </div>

          <div id="layer-desk" class="layer">
            <div class="springboard">
              <button class="app-tile" type="button" data-app="task">
                <span class="app-icon" aria-hidden="true">
                  <svg viewBox="0 0 32 32" fill="currentColor" stroke="none">
                    <rect x="15" y="6" width="2" height="20"/>
                    <rect x="13" y="8" width="6" height="3"/>
                    <rect x="13" y="15" width="6" height="3"/>
                    <rect x="13" y="22" width="6" height="3"/>
                  </svg>
                </span>
                <span class="app-name">TASK</span>
              </button>
              <button class="app-tile" type="button" data-app="flow">
                <span class="app-icon" aria-hidden="true">
                  <svg viewBox="0 0 32 32" fill="currentColor" stroke="none">
                    <rect x="6" y="8" width="20" height="2"/>
                    <rect x="6" y="15" width="16" height="2"/>
                    <rect x="6" y="22" width="11" height="2"/>
                  </svg>
                </span>
                <span class="app-name">FLOW</span>
              </button>
            </div>
          </div>

          <div id="layer-app" class="layer">
            <section id="app-task" class="app-page">
              <button id="task-heading" class="app-page__title task-heading" type="button">TASK</button>
              <div class="type-set">
                <button class="type-set__face" type="button" data-face="mono">MONO</button>
                <button class="type-set__face" type="button" data-face="serif">SERIF</button>
                <button class="type-set__face" type="button" data-face="sans">SANS</button>
                <span class="type-set__size">
                  <button type="button" data-step="-1">A−</button>
                  <span class="type-set__n">S</span>
                  <button type="button" data-step="1">A+</button>
                </span>
              </div>
              <div id="task-list" class="task-list is-on">
                <div id="task-rows" class="task-rows"></div>
                <form id="task-new" class="task-new" autocomplete="off">
                  <span class="task-prompt">+</span>
                  <input id="task-new-input" class="task-new__input" maxlength="80" spellcheck="false">
                </form>
              </div>
              <div id="task-detail" class="task-detail">
              <div class="task-detail__title">
                <input id="task-detail-name" class="task-detail__name" maxlength="80" spellcheck="false">
              </div>
                <div id="task-timeline" class="task-timeline"></div>
                <form id="task-log" class="task-log" autocomplete="off">
                  <span class="task-prompt">+</span>
                  <input id="task-log-input" class="task-log__input" maxlength="200" spellcheck="false">
                </form>
                <div class="task-foot">
                  <button id="task-done" class="task-drop" type="button">DONE</button>
                  <button id="task-drop" class="task-drop" type="button">DROP</button>
                </div>
                <div id="task-drop-ask" class="task-drop-ask">
                  <p id="task-drop-ask-text" class="task-drop-ask__text">DROP THIS?</p>
                  <div class="task-drop-ask__row">
                    <button id="task-drop-yes" class="task-drop" type="button">DROP</button>
                    <button id="task-drop-keep" class="task-drop" type="button">KEEP</button>
                  </div>
                </div>
              </div>
            </section>
            <section id="app-flow" class="app-page">
              <button id="flow-heading" class="app-page__title task-heading" type="button">FLOW</button>
              <div class="type-set">
                <button class="type-set__face" type="button" data-face="mono">MONO</button>
                <button class="type-set__face" type="button" data-face="serif">SERIF</button>
                <button class="type-set__face" type="button" data-face="sans">SANS</button>
                <span class="type-set__size">
                  <button type="button" data-step="-1">A−</button>
                  <span class="type-set__n">S</span>
                  <button type="button" data-step="1">A+</button>
                </span>
              </div>
              <p id="flow-flash" class="flow-flash"></p>

              <div id="flow-list" class="flow-panel is-on">
                <form id="flow-search" class="flow-search" autocomplete="off">
                  <span class="task-prompt">&gt;</span>
                  <input id="flow-search-input" class="flow-search__input" maxlength="80" spellcheck="false">
                </form>
                <div class="flow-toolbar">
                  <div id="flow-tabs" class="flow-tabs">
                    <button class="flow-tab is-on" type="button" data-tab="all">ALL</button>
                    <button class="flow-tab" type="button" data-tab="unread">UNREAD</button>
                    <button class="flow-tab" type="button" data-tab="saved">SAVED</button>
                    <button class="flow-tab" type="button" data-tab="later">LATER</button>
                  </div>
                  <div id="flow-range" class="flow-tabs">
                    <button class="flow-tab is-on" type="button" data-range="all">ALL</button>
                    <button class="flow-tab" type="button" data-range="today">TODAY</button>
                    <button class="flow-tab" type="button" data-range="week">WEEK</button>
                    <button class="flow-tab" type="button" data-range="month">MONTH</button>
                  </div>
                  <div id="flow-lang" class="flow-tabs">
                    <button class="flow-tab is-on" type="button" data-lang="">ANY</button>
                    <button class="flow-tab" type="button" data-lang="ZH">ZH</button>
                    <button class="flow-tab" type="button" data-lang="EN">EN</button>
                  </div>
                </div>
                <label class="flow-source" for="flow-source">
                  <span class="task-prompt">@</span>
                  <select id="flow-source">
                    <option value="">ALL SOURCES</option>
                  </select>
                </label>
                <div id="flow-cats" class="flow-cats"></div>
                <div id="flow-rows" class="task-rows"></div>
                <div id="flow-pager" class="flow-pager">
                  <button id="flow-prev" class="flow-tab" type="button">PREV</button>
                  <span id="flow-page">1 / 1</span>
                  <button id="flow-next" class="flow-tab" type="button">NEXT</button>
                </div>
                <div class="task-foot">
                  <button id="flow-refresh" class="task-drop" type="button">REFRESH</button>
                  <button id="flow-sources" class="task-drop" type="button">SOURCES</button>
                </div>
              </div>

              <div id="flow-read" class="flow-panel">
                <div class="flow-read__progress" hidden aria-hidden="true"><span id="flow-read-progress"></span></div>
                <div id="flow-read-scroll" class="flow-read__scroll">
                  <header class="flow-read__mast">
                    <h1 id="flow-read-title" class="flow-read__title"></h1>
                    <p id="flow-read-meta" class="flow-read__meta"></p>
                  </header>
                  <p id="flow-read-label" class="flow-read__label">ABSTRACT</p>
                  <div id="flow-read-body" class="flow-read__body"></div>
                </div>
                <div class="task-foot">
                  <button id="flow-save" class="task-drop" type="button">SAVE</button>
                  <button id="flow-later" class="task-drop" type="button">LATER</button>
                  <button id="flow-open" class="task-drop" type="button">OPEN ORIGINAL</button>
                </div>
              </div>

              <div id="flow-feeds" class="flow-panel">
                <div id="flow-feed-rows" class="task-rows"></div>
                <div class="task-foot">
                  <button id="flow-prune" class="task-drop" type="button">CLEAR INVALID</button>
                  <button id="flow-add" class="task-drop" type="button">+ ADD FEED</button>
                </div>
              </div>

              <div id="flow-form" class="flow-panel">
                <label class="flow-label" for="flow-form-name">NAME</label>
                <input id="flow-form-name" class="flow-form__input" maxlength="80" spellcheck="false">
                <label class="flow-label" for="flow-form-url">URL</label>
                <input id="flow-form-url" class="flow-form__input" maxlength="300" spellcheck="false">
                <p class="flow-label">CATEGORY</p>
                <div id="flow-form-cats" class="flow-tabs"></div>
                <div class="task-foot">
                  <button id="flow-form-ok" class="task-drop" type="button">SAVE</button>
                  <button id="flow-form-cancel" class="task-drop" type="button">BACK</button>
                </div>
              </div>
            </section>
          </div>

          <aside class="pixel-dog" aria-hidden="true">
            <span class="pixel-dog__eat" id="pixel-dog-eat" aria-hidden="true"></span>
            <span class="pixel-dog__say" id="pixel-dog-say">z</span>
            <span class="pixel-dog__wx" aria-hidden="true"><i></i><i></i><i></i></span>
            <canvas id="pixel-dog-canvas"></canvas>
          </aside>
          <canvas id="pixel-bone" class="pixel-bone" aria-hidden="true"></canvas>
          <div class="eink-flash" id="eink-flash" aria-hidden="true"></div>
        </div>
      </div>
      <button id="desk-btn" class="crt__key crt__desk" type="button" aria-pressed="false" aria-label="apps">
        APP
      </button>
      <button id="power-btn" class="crt__power crt__key" type="button" aria-pressed="true" aria-label="power">
        I/O
      </button>
      <button id="home-btn" class="crt__home" type="button" aria-label="home">
        <span class="crt__home-mark"></span>
      </button>
    </div>
  </div>

  <script src="/js/app.js?v=9"></script>
  <script src="/js/desk.js?v=16"></script>
  <script src="/js/flow.js?v=11"></script>
  <script src="/js/dashboard.js?v=9"></script>
  <script src="/js/pixel-dog.js?v=23"></script>
</body>
</html>
